<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QANCIYE STADIUM </title>
    <style>
        :root { --p: #2ecc71; --s: #2c3e50; --d: #e74c3c; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .page { display: none; } .page.active { display: block; }
        h1, h2, h3 { text-align: center; margin-bottom: 20px; color: var(--s); }
        h1 { color: var(--p); border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        p { color: #555; line-height: 1.6; margin-bottom: 20px; text-align: justify; }
        button { background: var(--p); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #27ae60; transform: scale(1.02); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--s); font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; }
        input:focus, select:focus { border-color: var(--p); outline: none; }
        .table-container { margin-top: 25px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: var(--s); color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
        .status-active { color: #27ae60; font-weight: bold; }
        .status-cancelled { color: var(--d); font-weight: bold; }
        .summary-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-top: 20px; }
        .summary-card { text-align: center; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid var(--p); }
        .summary-card span { display: block; font-size: 18px; font-weight: bold; color: #3498db; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page 1 -->
        <div id="page1" class="page active">
            <h1>Kusoo Dhawaada QANCIYE Stadium</h1>
            <p><strong>Garoonka Caalamiga ah ee QANCIYE</strong> waa xarun casri ah oo loogu talagalay horumarinta ciyaaraha.</p>
            <button onclick="go('page2')">Next (Sii Soco)</button>
        </div>

        <!-- Page 2 -->
        <div id="page2" class="page">
            <h2>Gali System-ka (Login)</h2>
            <div id="err" style="color: var(--d); text-align: center; margin-bottom: 10px; font-weight: bold;"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="user" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="1234" required>
            </div>
            <button onclick="login()">Login</button>
        </div>

        <!-- Page 3 -->
        <div id="page3" class="page">
            <h2>Maamulka Kulanka & Xogta Garoonka</h2>
            <form id="f" onsubmit="save(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group"><label>Magaca Kulanka</label><input type="text" id="mName" required></div>
                    <div class="form-group"><label>Waqtiga (Daqiiqo)</label><input type="number" id="dur" required></div>
                    <div class="form-group"><label>Kharashka (\$)</label><input type="number" id="inc" required></div>
                    <div class="form-group">
                        <label>Xaaladda</label>
                        <select id="st">
                            <option value="La Ciyaarayo">La Ciyaarayo</option>
                            <option value="Waa Baaqday">Waa Baaqday</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Kaydi Xogta Kulanka</button>
            </form>

            <button onclick="toggle()" style="background: var(--s); margin-top: 15px;">Eeg / Qari Xogta</button>
            
            <div id="tCon" class="table-container">
                <div class="summary-box">
                    <div class="summary-card">Kulandada: <span id="tw">0</span></div>
                    <div class="summary-card">Dakhliga: <span id="ti">\$0</span></div>
                    <div class="summary-card">Baaqday: <span id="tc">0</span></div>
                </div>
                <table>
                    <thead>
                        <tr><th>Taariikh & Maalin</th><th>Kulanka</th><th>Waqtiga</th><th>Kharashka</th><th>Xaaladda</th></tr>
                    </thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        function go(n) { 
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); 
            document.getElementById(n).classList.add('active'); 
        }
        function login() {
            if (document.getElementById('user').value === 'admin' && document.getElementById('pass').value === '1234') {
                go('page3');
            } else {
                document.getElementById('err').innerText = "Username ama Password waa khaldan yahay! (admin/1234)";
            }
        }
        function save(e) {
            e.preventDefault();
            let name = document.getElementById('mName').value;
            let dur = document.getElementById('dur').value;
            let inc = parseFloat(document.getElementById('inc').value);
            let st = document.getElementById('st').value;
            
            if(st === "Waa Baaqday") inc = 0;
            
            db.push({ date: new Date().toLocaleDateString('so-SO', { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' }), name, dur, inc, st });
            document.getElementById('f').reset(); 
            update(); 
            alert('La kaydiyey!');
        }
        function toggle() { 
            let c = document.getElementById('tCon'); 
            c.style.display = (c.style.display === 'none' || c.style.display === '') ? 'block' : 'none'; 
        }
        function update() {
            let b = document.getElementById('tBody'), t = 0, i = 0, c = 0;
            b.innerHTML = "";
            db.forEach(r => {
                if(r.st === "La Ciyaarayo") { t++; i += r.inc; } else { c++; }
                b.innerHTML += `<tr><td>${r.date}</td><td>${r.name}</td><td>${r.dur} dsn</td><td>$${r.inc}</td><td class="${r.st==='La Ciyaarayo'?'status-active':'status-cancelled'}">${r.st}</td></tr>`;
            });
            document.getElementById('tw').innerText = t;
            document.getElementById('ti').innerText = "\$" + i;
            document.getElementById('tc').innerText = c;
        }
    </script>
</body>
</html>
